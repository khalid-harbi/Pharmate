name: capstone_one
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  any_image_view: ^2.1.0
  dio: ^5.9.2
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3

  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  fpdart: ^1.2.0
  gap: ^3.0.1
  get_it: ^9.2.1

  go_router: ^17.1.0
  intl: ^0.20.2
  sizer: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Phramate-logo.png
    - assets/images/Phramate-logo-splash.png
    - assets/images/pharmate-logo-icon.png

flutter_native_splash:
  color: "#EEF5F9"
  image: assets/images/Phramate-logo-splash.png
  android: true
  ios: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/pharmate-logo-icon.png"
